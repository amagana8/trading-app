syntax = "proto3";

package orderbook.v1;

import "google/protobuf/timestamp.proto";
import "orderbook/v1/decimal_value.proto";

option csharp_namespace = "OrderBook.Order";

service OrderEventsService {
  rpc GetOrderEvents(GetOrderEventsRequest) returns (stream GetOrderEventsResponse);
}

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

enum OrderAction {
  ORDER_ACTION_UNSPECIFIED = 0;
  ORDER_ACTION_NEW = 1;
  ORDER_ACTION_UPDATE = 2;
  ORDER_ACTION_CANCEL = 3;
}

message Order {
  string account_id = 1;
  string bond_id = 2;
  google.protobuf.Timestamp created_at = 3;
  string order_id = 4;
  DecimalValue price = 5;
  int64 quantity = 6;
  int64 sequence = 7;
  Side side = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message GetOrderEventsResponse {
  Order order = 1;
  OrderAction update_type = 2;
}

message GetOrderEventsRequest {}
